name: erika_flutter
description: Flutter HDR AV1 video and static AVIF/HEIF/JPEG player powered by Erika, with system media controls.
version: 0.2.0

homepage: https://github.com/Nyaaaaaaaaaaaaaaaaaaaaaaaa/Erika
repository: https://github.com/Nyaaaaaaaaaaaaaaaaaaaaaaaa/Erika
issue_tracker: https://github.com/Nyaaaaaaaaaaaaaaaaaaaaaaaa/Erika/issues
documentation: https://github.com/Nyaaaaaaaaaaaaaaaaaaaaaaaa/Erika/tree/main/docs

topics:
  - video-player
  - media-player
  - ffmpeg
  - rust
  - hdr

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.26

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.aimesoft.erika_flutter
        pluginClass: ErikaFlutterPlugin
      ios:
        pluginClass: ErikaFlutterPlugin
      tvos:
        pluginClass: ErikaFlutterPlugin
      macos:
        pluginClass: ErikaFlutterPlugin
      windows:
        pluginClass: ErikaFlutterPluginCApi
      ohos:
        pluginClass: ErikaFlutterPlugin
