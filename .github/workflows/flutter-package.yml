name: Flutter package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/ci-changes.yml"
      - ".github/workflows/flutter-package.yml"
      - "packages/erika_flutter/**"
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/ci-changes.yml"
      - ".github/workflows/flutter-package.yml"
      - "packages/erika_flutter/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  package:
    name: Pub package (isolated)
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify native artifact manifest
        if: needs.changes.outputs.artifacts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=packages/erika_flutter/native_artifacts.properties
          version=$(sed -n 's/^ERIKA_NATIVE_VERSION=//p' "$manifest" | tr -d '\r')
          mkdir -p "$RUNNER_TEMP/erika-checksums"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/erika-checksums"
          python3 .github/scripts/check_native_artifacts.py \
            "$manifest" "$RUNNER_TEMP/erika-checksums/SHA256SUMS"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate package
        working-directory: packages/erika_flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          flutter pub publish --dry-run
      - name: Test outside the monorepo
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/erika-standalone"
          mkdir -p "$root/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$root/erika_flutter"
          test ! -e "$root/crates"
          cd "$root/erika_flutter"
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded

  android:
    name: Android app from isolated package
    needs: [changes, package]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-android-aarch64-release-default-ndk${{ env.ANDROID_NDK_VERSION }}-api26-${{ hashFiles('xtask/**', 'third_party/patches/**', 'third_party/wgpu-hal/**', '.github/actions/cache-native/action.yml') }}
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android NDK and native build tools
        shell: bash
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION"
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make ninja-build pkg-config python3-venv
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: ./.github/actions/cache-native
        with:
          target: aarch64-linux-android
          toolchain: ndk${{ env.ANDROID_NDK_VERSION }}-api26
      - name: Create isolated consumer
        shell: bash
        env:
          ERIKA_FORCE_SOURCE_BUILD: "1"
          ERIKA_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/erika-android"
          mkdir -p "$root/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$root/erika_flutter"
          flutter create --platforms=android --project-name erika_consumer "$root/app"
          cd "$root/app"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          flutter pub add erika_flutter --path ../erika_flutter
          flutter build apk --debug --target-platform android-arm64

  apple:
    name: ${{ matrix.platform }} app from isolated package
    needs: [changes, package]
    if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.changes.outputs.apple) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'ios' && 'aarch64-apple-ios-sim,x86_64-apple-ios' || 'aarch64-apple-darwin,x86_64-apple-darwin' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-${{ matrix.platform }}-universal-debug-${{ matrix.platform == 'ios' && 'wgpu-min13.0' || 'no-default-min11.0' }}-${{ hashFiles('xtask/**', 'third_party/patches/**', 'third_party/wgpu-hal/**', '.github/actions/cache-native/action.yml') }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install native build tools
        run: brew install nasm meson ninja pkg-config
      - uses: ./.github/actions/cache-native
        if: matrix.platform == 'ios'
        with:
          target: aarch64-apple-ios-sim
          toolchain: ios-min${{ env.IPHONEOS_DEPLOYMENT_TARGET }}
      - uses: ./.github/actions/cache-native
        if: matrix.platform == 'ios'
        with:
          target: x86_64-apple-ios
          toolchain: ios-min${{ env.IPHONEOS_DEPLOYMENT_TARGET }}
      - uses: ./.github/actions/cache-native
        if: matrix.platform == 'macos'
        with:
          target: aarch64-apple-darwin
          toolchain: macos-min${{ env.MACOSX_DEPLOYMENT_TARGET }}
      - uses: ./.github/actions/cache-native
        if: matrix.platform == 'macos'
        with:
          target: x86_64-apple-darwin
          toolchain: macos-min${{ env.MACOSX_DEPLOYMENT_TARGET }}
      - name: Create isolated consumer
        shell: bash
        env:
          ERIKA_PREBUILT_CACHE_DIR: ${{ runner.temp }}/erika-prebuilt-cache
          ERIKA_FORCE_SOURCE_BUILD: "1"
          ERIKA_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/erika-${{ matrix.platform }}"
          mkdir -p "$root/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$root/erika_flutter"
          flutter create --platforms=${{ matrix.platform }} --project-name erika_consumer "$root/app"
          cd "$root/app"
          flutter pub add erika_flutter --path ../erika_flutter
          if [[ "${{ matrix.platform }}" == ios ]]; then
            flutter build ios --simulator --debug --no-codesign
          else
            flutter build macos --debug
          fi

  windows:
    name: Windows app from isolated package
    needs: [changes, package]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-windows-x86_64-debug-default-msvc-${{ hashFiles('xtask/**', 'third_party/patches/**', 'third_party/wgpu-hal/**', '.github/actions/cache-native/action.yml') }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          path-type: inherit
          install: >-
            make
            tar
            diffutils
            coreutils
            pkgconf
            perl
            zip
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install native build tools
        shell: pwsh
        run: |
          choco install -y --no-progress nasm zip
          pip install --quiet meson ninja
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            choco install llvm -y --no-progress
          }
          "MSYS2_ROOT=C:\msys64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
      - uses: ./.github/actions/cache-native
        with:
          target: x86_64-pc-windows-msvc
          toolchain: msvc
      - name: Create isolated consumer
        shell: pwsh
        env:
          ERIKA_FORCE_SOURCE_BUILD: "1"
          ERIKA_REPO_ROOT: ${{ github.workspace }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "erika-windows"
          $package = Join-Path $root "erika_flutter"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          git archive HEAD:packages/erika_flutter -o (Join-Path $root "package.tar")
          tar -xf (Join-Path $root "package.tar") -C $package
          flutter create --platforms=windows --project-name erika_consumer (Join-Path $root "app")
          Set-Location (Join-Path $root "app")
          flutter pub add erika_flutter --path ../erika_flutter
          flutter build windows --debug

  openharmony:
    name: HarmonyOS NEXT bridge from isolated package
    needs: [changes, package]
    if: needs.changes.outputs.ohos == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: aarch64-unknown-linux-ohos
      - uses: Swatinem/rust-cache@v2
        with:
          key: flutter-ohos-aarch64-release-wgpu-sdk6.0-api18-${{ hashFiles('xtask/**', 'third_party/patches/**', 'third_party/wgpu-hal/**', '.github/actions/cache-native/action.yml') }}
      - name: Setup HarmonyOS NEXT SDK
        id: ohos_sdk
        uses: openharmony-rs/setup-ohos-sdk@b312caf8a43bb836aa24c08f65f97e1f09a89cad
        with:
          # setup-ohos-sdk mirror tag; the SDK reports HarmonyOS 6 / API 20.
          version: "6.0"
          components: native
          cache: true
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make ninja-build pkg-config
      - uses: ./.github/actions/cache-native
        with:
          target: aarch64-unknown-linux-ohos
          toolchain: sdk6.0-api18
      - name: Build isolated bridge
        shell: bash
        env:
          NATIVE_ROOT: ${{ steps.ohos_sdk.outputs.ohos_sdk_native }}
          ERIKA_FORCE_SOURCE_BUILD: "1"
          ERIKA_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/erika-ohos"
          mkdir -p "$root/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$root/erika_flutter"
          cmake -S "$root/erika_flutter/ohos/src/main/cpp" \
            -B "$root/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NATIVE_ROOT/build/cmake/ohos.toolchain.cmake" \
            -DOHOS_ARCH=arm64-v8a \
            -DOHOS_SDK_NATIVE="$NATIVE_ROOT"
          cmake --build "$root/build" --target erika_flutter_plugin
          test -f "$(find "$root/build" -type f -name 'liberika_flutter.so' -print -quit)"
          test -f "$(find "$root/build" -type f -name 'liberika_capi.so' -print -quit)"
