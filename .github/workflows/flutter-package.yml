name: Flutter package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flutter-package.yml"
      - "packages/erika_flutter/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter-package.yml"
      - "packages/erika_flutter/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  package:
    name: Pub package (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate package
        working-directory: packages/erika_flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          flutter pub publish --dry-run
      - name: Test outside the monorepo
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/erika-standalone"
          mkdir -p "$root/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$root/erika_flutter"
          test ! -e "$root/crates"
          cd "$root/erika_flutter"
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded

  android:
    name: Android app from isolated package
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android NDK and native build tools
        shell: bash
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION"
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make ninja-build pkg-config python3-venv
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/erika
          key: erika-flutter-android-${{ hashFiles('packages/erika_flutter/native_artifacts.properties') }}
      - name: Create isolated consumer
        shell: bash
        env:
          ERIKA_FORCE_SOURCE_BUILD: "1"
          ERIKA_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/erika-android"
          mkdir -p "$root/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$root/erika_flutter"
          flutter create --platforms=android --project-name erika_consumer "$root/app"
          cd "$root/app"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          flutter pub add erika_flutter --path ../erika_flutter
          flutter build apk --debug --target-platform android-arm64

  apple:
    name: ${{ matrix.name }} app from isolated package
    needs: package
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS simulator
            platform: ios
            build: flutter build ios --simulator --debug --no-codesign
          - name: macOS
            platform: macos
            build: flutter build macos --debug
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install native build tools
        run: brew install nasm meson ninja pkg-config
      - uses: actions/cache@v4
        with:
          path: third_party
          key: erika-flutter-${{ matrix.platform }}-source-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**', 'packages/erika_flutter/ios/*.podspec', 'packages/erika_flutter/tvos/*.podspec', 'packages/erika_flutter/macos/*.podspec') }}
          restore-keys: erika-flutter-${{ matrix.platform }}-source-
          save-always: true
      - name: Create isolated consumer
        shell: bash
        env:
          ERIKA_PREBUILT_CACHE_DIR: ${{ runner.temp }}/erika-prebuilt-cache
          ERIKA_FORCE_SOURCE_BUILD: "1"
          ERIKA_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/erika-${{ matrix.platform }}"
          mkdir -p "$root/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$root/erika_flutter"
          flutter create --platforms=${{ matrix.platform }} --project-name erika_consumer "$root/app"
          cd "$root/app"
          flutter pub add erika_flutter --path ../erika_flutter
          ${{ matrix.build }}

  tvos:
    name: tvOS runtime from isolated package
    needs: package
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install native build tools
        run: brew install nasm meson ninja pkg-config
      - uses: actions/cache@v4
        with:
          path: third_party
          key: erika-flutter-tvos-source-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Verify source-built tvOS simulator runtime
        shell: bash
        env:
          TVOS_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/erika-tvos"
          mkdir -p "$root/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$root/erika_flutter"
          cargo run --locked -p xtask -- deps build \
            --profile lgpl --target aarch64-apple-tvos-sim
          TVOS_SDKROOT="$(xcrun --sdk appletvsimulator --show-sdk-path)"
          export SDKROOT="$TVOS_SDKROOT"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_tvos_sim="--target=arm64-apple-tvos${TVOS_DEPLOYMENT_TARGET}-simulator -isysroot $TVOS_SDKROOT"
          ERIKA_NATIVE_PROFILE=lgpl \
          ERIKA_NATIVE_TARGET=aarch64-apple-tvos-sim \
            cargo +nightly rustc -Z build-std=std,panic_abort --locked \
              -p erika_capi --lib --release \
              --target aarch64-apple-tvos-sim \
              --no-default-features --crate-type staticlib
          cp target/aarch64-apple-tvos-sim/release/liberika_capi.a \
            "$root/liberika_capi.a"
          lipo -info "$root/liberika_capi.a" | grep -Eq 'arm64|Non-fat'

  windows:
    name: Windows app from isolated package
    needs: package
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          path-type: inherit
          install: >-
            make
            tar
            diffutils
            coreutils
            pkgconf
            perl
            zip
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install native build tools
        shell: pwsh
        run: |
          choco install -y --no-progress nasm zip
          pip install --quiet meson ninja
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            choco install llvm -y --no-progress
          }
          "MSYS2_ROOT=C:\msys64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
      - name: Create isolated consumer
        shell: pwsh
        env:
          ERIKA_FORCE_SOURCE_BUILD: "1"
          ERIKA_REPO_ROOT: ${{ github.workspace }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "erika-windows"
          $package = Join-Path $root "erika_flutter"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          git archive HEAD:packages/erika_flutter -o (Join-Path $root "package.tar")
          tar -xf (Join-Path $root "package.tar") -C $package
          flutter create --platforms=windows --project-name erika_consumer (Join-Path $root "app")
          Set-Location (Join-Path $root "app")
          flutter pub add erika_flutter --path ../erika_flutter
          flutter build windows --debug

  openharmony:
    name: OpenHarmony bridge from isolated package
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: aarch64-unknown-linux-ohos
      - name: Setup OpenHarmony SDK
        id: ohos_sdk
        uses: openharmony-rs/setup-ohos-sdk@b312caf8a43bb836aa24c08f65f97e1f09a89cad
        with:
          version: "5.1.0"
          components: native
          cache: true
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make ninja-build pkg-config
      - name: Build isolated bridge
        shell: bash
        env:
          NATIVE_ROOT: ${{ steps.ohos_sdk.outputs.ohos_sdk_native }}
          ERIKA_FORCE_SOURCE_BUILD: "1"
          ERIKA_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/erika-ohos"
          mkdir -p "$root/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$root/erika_flutter"
          cmake -S "$root/erika_flutter/ohos/src/main/cpp" \
            -B "$root/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NATIVE_ROOT/build/cmake/ohos.toolchain.cmake" \
            -DOHOS_ARCH=arm64-v8a \
            -DOHOS_SDK_NATIVE="$NATIVE_ROOT"
          cmake --build "$root/build" --target erika_flutter_plugin
          test -f "$(find "$root/build" -type f -name 'liberika_flutter.so' -print -quit)"
          test -f "$(find "$root/build" -type f -name 'liberika_capi.so' -print -quit)"
